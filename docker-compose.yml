services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"]          # enable JetStream
    ports: ["4222:4222"]

  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["./migrations:/migrations"]
    command: ["-path=/migrations", "-database=postgres://orders:orders@postgres:5432/orders?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
