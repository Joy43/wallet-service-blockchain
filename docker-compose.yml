services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"]          # enable JetStream
    ports: ["4222:4222"]

  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["./services/auth/migrations:/migrations"]
    command: ["-path=/migrations", "-database=postgres://auth:auth@postgres:5432/auth?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_HTTP_ADDR: ":8081"
      AUTH_GRPC_LISTEN_ADDR: ":9090"
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run `make keygen` and export JWT_PRIVATE_KEY}
      LOG_LEVEL: INFO
    ports: ["8081:8081", "9090:9090"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
