apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: platform }
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 8081, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: platform }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata:
      labels: { app: auth-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auth-service
          image: yourorg/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
            - { name: grpc, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_PRIVATE_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: auth-service, namespace: platform }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: auth-service, namespace: platform }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: auth-service } }
