# Non-secret settings. Secrets (DATABASE_URL, JWT_PRIVATE_KEY, POSTGRES_PASSWORD) live in the
# "app-secrets" Secret: see secret.example.yaml / `make k8s-secret`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: platform
data:
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  SHUTDOWN_TIMEOUT: 15s
  AUTH_HTTP_ADDR: ":8081"
  AUTH_GRPC_LISTEN_ADDR: ":9090"
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 720h
  LOGIN_RATE_LIMIT: "10"
  LOGIN_RATE_WINDOW: 1m
  BCRYPT_COST: "12"
