apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - auth.yaml
  - ingress.yaml
# migrate-job.yaml is applied separately by `make k8s-apply` (needs the migrations ConfigMap first).
# Pin real image tags here instead of :latest:
images:
  - { name: yourorg/auth-service, newTag: latest }
