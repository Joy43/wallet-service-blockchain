# Applies migrations/*.sql. The "migrations" ConfigMap is created by `make k8s-apply`
# (kustomize cannot read files outside k8s/). Jobs are immutable, so the Makefile deletes
# the old one before re-applying.
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: platform }
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args: ["-path=/migrations", "-database=$(DATABASE_URL)", "up"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
          volumeMounts: [{ name: migrations, mountPath: /migrations }]
      volumes:
        - name: migrations
          configMap: { name: migrations }
