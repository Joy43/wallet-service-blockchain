# Requires an ingress controller (e.g. ingress-nginx). Change the host.
# auth-service gRPC (9090) is intentionally NOT exposed: it is cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: api, namespace: platform }
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.local
      http:
        paths:
          - { path: /v1/auth, pathType: Prefix, backend: { service: { name: auth-service, port: { number: 8081 } } } }