// gRPC contract for synchronous service-to-service calls.
// Generate code with: make proto  (needs protoc, protoc-gen-go, protoc-gen-go-grpc)
// Add an inbound adapter at internal/transport/grpcapi that calls the same OrderService.
syntax = "proto3";

package order.v1;

option go_package = "github.com/yourorg/order-service/gen/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message Order {
  string id = 1;
  string customer_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  int64 amount_cents = 5;
  string status = 6;
  int64 created_at_unix = 7;
}

message CreateOrderRequest {
  string customer_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  int64 amount_cents = 4;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}
